appId: app.dataai.desktop
productName: DataAI
copyright: Copyright © DataAI
directories:
  output: release
files:
  - out/**/*
  - package.json
  - node_modules/**/*
  - "!node_modules/monaco-editor/**"
  - "!node_modules/@fontsource/**"
  - "!node_modules/react/**"
  - "!node_modules/react-dom/**"
  - "!**/*.map"
asar: true
asarUnpack:
  - "**/node_modules/better-sqlite3/**"
npmRebuild: true
linux:
  target:
    - tar.gz
  category: Development
  icon: ../../resources/icons/app_icon.png
  artifactName: DataAI-${version}-linux-tip.${ext}
win:
  target:
    - nsis
  icon: ../../resources/icons/app_icon.ico
  artifactName: DataAI-${version}-win-tip.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: DataAI-${version}-win-tip.${ext}
